    $('#svgbox').innerHTML = sceneSVG({ board: ALL_TOOLS.filter(t => t !== 'dest'), labels: f.sil, sil: f.sil, messyBoard: !f.sil, tape: f.tape, minmax: f.minmax,
      zones: f.zones, sched: f.sched, needle: 20, bins: { torn: .12, aran: 1.15, tar: .6 }, boxWalk: true });
    $('#spots').innerHTML = ZONES.map((z, i) => `<div class="hotspot ${(plan[z.id] || []).length ? 'ok' : ''}" data-drop="${z.id}" data-z="${z.id}" style="${pct(z.x, z.y)}">${i + 1}</div>`).join('');
    $('#zl').innerHTML = ZONES.map((z, i) => `<li data-drop="${z.id}" data-z="${z.id}" class="${(plan[z.id] || []).length ? 'ok' : ''}"><span class="num">${i + 1}</span><span style="flex:1"><b style="font-weight:500">${z.n}</b><br><span class="muted">${z.info}</span>
      <span class="zchips">${(plan[z.id] || []).map(c => `<button class="zchip" data-rm="${z.id}:${c}" title="Quitar">${ctlById(c).n}<span aria-hidden="true">×</span></button>`).join('')}</span></span></li>`).join('');
    $$('[data-z]').forEach(el => el.onclick = e => { if (e.target.closest('[data-rm]')) return; if (selected) add(selected, el.dataset.z); });
    $$('[data-rm]').forEach(b => b.onclick = () => { const [z, c] = b.dataset.rm.split(':'); plan[z] = plan[z].filter(x => x !== c); render(); });
    const n = Object.values(plan).reduce((t, l) => t + l.length, 0);
    $('#cnt').textContent = `${n} control${n === 1 ? '' : 'es'}`;
    $('#try').disabled = n === 0;
  }

  function audit40() {
    const LIMIT = 40, ev = evalStandard(plan), f = flags(plan);
    const det = DEVS.filter(d => ev.cov[d.z] >= .5);
    const r = { found: 0, errors: 0, time: 0 };
    attempts++;
    view(`<section>
      <div class="stage-head"><div><div class="kicker">4S · Seiketsu 清潔 · Estandarizar</div><h2>Paso 2 · Una semana después: auditoría de ${LIMIT} segundos</h2>
        <p class="muted">Recorré el puesto con tu estándar y tocá todo lo que esté fuera de él.</p></div>
        <div class="counter" id="cnt">Desvíos: 0</div></div>
      <div class="scene-wrap solo" id="sw" style="cursor:pointer">
        <div class="layer">${sceneSVG({ board: ALL_TOOLS.filter(t => t !== 'dest'), labels: f.sil, sil: f.sil, messyBoard: !f.sil, tape: f.tape, minmax: f.minmax, zones: f.zones, sched: f.sched, schedUnsigned: true, needle: 110, bins: { torn: .12, aran: .75, tar: .6 }, boxWalk: true })}</div>
        <div class="layer">${DEVS.map(d => `<div class="hit" data-dev="${d.id}" style="${pct(d.x, d.y)}"></div>`).join('')}</div>
      </div>
      <div class="row" style="margin-top:14px"><b>Tiempo</b><div class="timebar" style="flex:1"><i id="tb"></i></div><span class="muted">Errores: <b id="err">0</b></span></div>
    </section>`);
    let over = false;
    const t0 = performance.now();
    const tick = () => {
      if (over) return;
      const left = 1 - (performance.now() - t0) / (LIMIT * 1000);
      $('#tb').style.width = Math.max(0, left * 100) + '%';
      if (left <= 0) finish(); else requestAnimationFrame(tick);
    };
    tick();
    const blind = new Set();
    $('#sw').onclick = e => {
      if (over) return;
      const hit = e.target.closest('[data-dev]');
      if (!hit) { r.errors++; $('#err').textContent = r.errors; return toast('Eso está dentro del estándar.', 'ko'); }
      const d = DEVS.find(x => x.id === hit.dataset.dev);
      if (hit.classList.contains('found')) return;
      if (ev.cov[d.z] < .5) {
        if (!blind.has(d.id)) { blind.add(d.id); toast('Acá no hay un control que diga cómo debería estar: no se puede saber si está bien o mal.'); }
        return;
      }
      hit.classList.add('found'); r.found++;
      $('#cnt').textContent = `Desvíos: ${r.found}`;
      toast(d.t, 'ok');
      if (r.found === det.length) setTimeout(finish, 900);
    };
    if (!det.length) setTimeout(() => toast('Con este estándar no hay forma de saber qué está fuera de lugar.'), 600);
    async function finish() {
      if (over) return;
      over = true;
      r.time = (performance.now() - t0) / 1000;
      const missed = det.filter(d => !$(`[data-dev="${d.id}"]`).classList.contains('found'));
      missed.forEach(d => $(`[data-dev="${d.id}"]`).classList.add('pulse'));
      if (missed.length) await feedback({ title: `Se terminó el tiempo: faltaron ${missed.length}`, text: missed.map(d => '• ' + d.t).join('\n') });
      result(ev, r, det);
    }
  }

  function result(ev, r, det) {
    const score = Math.round(100 * clamp(.45 * ev.coverage + .35 * (r.found / DEVS.length) + .2 * ev.econ - r.errors * .03));
    const tip = seiketsuTip(plan, ev);
    const visible = ZONES.filter(z => ev.cov[z.id] === 1).length;
    const delta = prevScore === null ? '' : ` <span style="font-size:14px;color:${score >= prevScore ? 'var(--green-text)' : 'var(--danger)'}">${score >= prevScore ? '+' : ''}${score - prevScore} vs intento anterior</span>`;
    prevScore = score;
    const good = visible === ZONES.length ? 'Tu estándar hace visible cada uno de los problemas del puesto.' : visible ? `Tu estándar hace evidente lo que pasa en ${visible} de ${ZONES.length} zonas: ${ZONES.filter(z => ev.cov[z.id] === 1).map(z => z.en).join(', ')}.` : det.length ? 'Algunos desvíos se pueden detectar, aunque todavía con controles a medias.' : 'Diste el primer paso: pensar qué hay que controlar en cada zona.';
    S.r.seiketsu = { score, coverage: ev.coverage, waste: ev.waste.length, found: r.found, detectable: det.length, errors: r.errors, time: r.time, attempts, tip, plan: JSON.parse(JSON.stringify(plan)) };
    view(`<section>
      <div class="stage-head"><div><div class="kicker">4S · Seiketsu 清潔 · Estandarizar</div><h2>Cómo funcionó tu estándar</h2></div></div>
      <div class="card" style="padding:18px">
        <div class="kicker" style="margin-bottom:4px">Intento ${attempts}</div>
        <div class="row" style="align-items:baseline;gap:8px"><span style="font-size:36px;font-weight:600;letter-spacing:-.02em">${score}</span><span class="muted">/ 100</span>${delta}</div>
        <table class="tbl ztbl" style="margin-top:12px"><thead><tr><th>Zona</th><th>Tu control</th><th>En la auditoría</th></tr></thead><tbody>
          ${ZONES.map(z => { const v = ev.cov[z.id]; const st = v === 1 ? ['ok', '✓', 'Se ve de un vistazo'] : v > 0 ? ['mid', '≈', 'A medias'] : ['ko', '✗', 'Pasó sin que se note'];
            return `<tr><td>${z.n}</td><td>${(plan[z.id] || []).map(c => ctlById(c).n).join(' + ') || '<span class="muted">Ninguno</span>'}</td><td><span class="zst ${st[0]}">${st[1]}</span> ${st[2]}</td></tr>`; }).join('')}
        </tbody></table>
        <p class="muted" style="margin:8px 0 0;font-size:13px">Detectaste ${r.found} de ${DEVS.length} desvíos en ${fmt(Math.min(r.time, 40))}${r.errors ? ` · ${r.errors} toque${r.errors === 1 ? '' : 's'} de más` : ''}${ev.waste.length ? ` · ${ev.waste.length} control${ev.waste.length === 1 ? '' : 'es'} que no suma${ev.waste.length === 1 ? '' : 'n'}` : ''}.</p>
        <div class="tip" style="background:var(--green-soft);color:var(--green-ink);box-shadow:none;margin-top:12px"><b>Lo que hiciste bien:</b> ${good}</div>
        <div class="tip" style="margin-top:8px"><b>${score === 100 ? 'Para sostenerlo' : 'Punto de mejora'}:</b> ${tip}</div>
      </div>
      <div class="row" style="margin-top:14px"><span class="spacer"></span>
        ${score === 100 ? '' : '<button class="btn ghostbtn" id="adjust">Ajustar mi estándar</button>'}
        <button class="btn yellow" id="next">Seguir</button></div>
    </section>`);
    if ($('#adjust')) $('#adjust').onclick = design;
    $('#next').onclick = () => stageEnd(3,
      `<div class="compare">
        <div class="metric"><div class="v">${score} / 100</div><div class="l">tu estándar, en ${attempts} intento${attempts === 1 ? '' : 's'}</div></div>
        <div class="metric"><div class="v">${visible} / ${ZONES.length}</div><div class="l">zonas donde un desvío se ve de un vistazo</div></div>
        <div class="metric"><div class="v">${r.found} / ${DEVS.length}</div><div class="l">desvíos detectados en la auditoría</div></div>
      </div>`,
      'un estándar no es un cartel ni un recordatorio: es un <b>control visual en el lugar</b> que dice qué, dónde y cuánto. Donde no hay control, un desvío pasa sin que nadie lo note; donde hay uno de más, se suma trabajo sin ganar nada.');
  }
}

// =========================================================
// 5S · SHITSUKE — Una semana de trabajo
// =========================================================
const DILEMMAS = [
  { day: 'Lunes', q: 'Faltan 10 minutos para el cierre y te piden adelantar un trabajo para mañana.', o: [
    { t: 'Hacés la ronda de cierre de 5 minutos y después seguís con el trabajo.', lv: 3, fb: 'La ronda corta no se negocia: cinco minutos hoy evitan perder mucho más mañana.' },
    { t: 'Hacés una pasada de un minuto solo por la mesa y seguís con el trabajo.', lv: 1, extra: ['trash'], fb: 'Algo es mejor que nada, pero lo que quedó en el piso y en el estante se suma a mañana.' },
    { t: 'Saltás la ronda: mañana ordenás todo junto.', lv: 0, skip: 1, fb: 'Hoy no hay ronda de cierre: lo que quedó fuera de lugar se acumula para mañana.',
      next: { title: 'Martes, 7:00', text: 'Arrancaste el día buscando la llave 13 entre lo que quedó tirado: 12 minutos perdidos, y el trabajo urgente se atrasó igual.', pen: 8 } },
  ] },
  { day: 'Martes', q: 'Un compañero del turno anterior dejó su tijera sobre tu mesa.', o: [
    { t: 'La devolvés a su lugar en el tablero y se lo comentás al compañero, con buena onda.', lv: 3, fb: 'Corregir y avisar con respeto: así el estándar es de todos y no solo tuyo.' },
    { t: 'La dejás donde está: no es tuya.', lv: 0, extra: ['tool:tijera'], fb: 'Lo que se tolera se vuelve normal. La tijera va a estar esperándote en la ronda de cierre.' },
    { t: 'La guardás en tu cajón para que no se pierda.', lv: 1, pen: 8, fb: 'Un cajón personal no es un lugar estandarizado: el próximo que la busque no la va a encontrar, y su lugar en el tablero queda vacío.' },
  ] },
  { day: 'Miércoles', q: 'El cronograma dice que hoy te toca limpiar el tambor de aceite, pero a simple vista está limpio.', o: [
    { t: 'Lo limpiás e inspeccionás igual, y firmás el cronograma.', lv: 3, fb: 'Al limpiarlo encontrás una pequeña pérdida y la reportás a tiempo. Limpiar es inspeccionar.' },
    { t: 'Lo salteás, pero firmás igual para no quedar mal.', lv: 0, pen: 10, fb: 'Firmar sin hacer rompe la confianza en el estándar: el registro deja de servir.',
      next: { title: 'Jueves, 9:30', text: 'Apareció un charco de aceite: el tambor perdía y nadie lo vio. Y el cronograma decía que se había limpiado.', pen: 8, extra: ['spill'] } },
    { t: 'Lo salteás sin firmar: total se ve limpio.', lv: 1, fb: 'Que “se vea limpio” no alcanza: la limpieza programada también es una inspección.',
      next: { title: 'Jueves, 9:30', text: 'Apareció un charco de aceite: el tambor perdía y nadie lo vio.', pen: 8, extra: ['spill'] } },
  ] },
  { day: 'Jueves', q: 'Aparece en tu estante una caja de repuestos de otro sector, sin rótulo.', o: [
    { t: 'Le ponés tarjeta roja y avisás al responsable del área.', lv: 3, fb: 'Se identifica, se avisa y se decide. No se acumula ni se descarta a ciegas.' },
    { t: 'La corrés al costado del pasillo para que no moleste.', lv: 1, extra: ['box'], fb: 'Así empieza la acumulación: un objeto sin dueño termina invadiendo el paso.' },
    { t: 'La tirás: no es de tu sector.', lv: 0, pen: 10, fb: 'No se descarta lo que no se evaluó: podía ser un repuesto crítico de otro sector.' },
  ] },
  { day: 'Viernes', q: 'A las 14 h hay auditoría. Un compañero propone esconder en el depósito todo lo que sobra.', o: [
    { t: 'Proponés mostrar el puesto como está y anotar las mejoras pendientes.', lv: 3, fb: 'Las 5S son para trabajar mejor, no para la foto. Mostrar lo pendiente es lo que permite mejorarlo.' },
    { t: 'Muestran el puesto como está, pero sin anotar lo pendiente.', lv: 1, pen: 4, fb: 'No maquillar está bien, pero lo que no se anota no tiene responsable ni fecha: es probable que siga igual la semana que viene.' },
    { t: 'Esconden todo: el puesto queda impecable para la auditoría.', lv: 0, pen: 12, fb: 'El problema no desaparece, se muda al depósito. El lunes vuelve todo y la auditoría no sirvió para nada.' },
  ] },
];
const NEW_PER_DAY = [3, 3, 4, 4, 5];
const HABIT_MAX = 15;
const LEVELS = { 3: { t: 'Sostenible', c: 'best', title: 'Decisión sostenible' }, 1: { t: 'A medias', c: 'mid', title: 'A medias' }, 0: { t: 'Atajo', c: 'worse', title: 'Atajo' } };
const ROUND = 15;
const FIX_MSG = { tool: 'Herramienta a su lugar', trash: 'Basura al cesto', spill: 'Derrame limpiado', box: 'Pasillo liberado', bin: 'Reposición pedida' };

function shitsuke() {
  const st = { devs: [], spawned: 0, fixed: 0, pen: 0, best: 0, habit: 0, picks: [], day: -1, next: null };
  const free = k => {
    if (k === 'tool') { const used = st.devs.filter(d => d.k === 'tool'); const pos = [0, 1, 2, 3, 4].filter(p => !used.some(d => d.pos === p)); const ids = ALL_TOOLS.filter(t => !used.some(d => d.id === t)); return pos.length && ids.length ? { pos, ids } : null; }
    if (k === 'trash') { const p = [0, 1, 2].filter(p => !st.devs.some(d => d.k === 'trash' && d.pos === p)); return p.length ? p : null; }
    if (k === 'spill') { const p = [0, 1].filter(p => !st.devs.some(d => d.k === 'spill' && d.pos === p)); return p.length ? p : null; }
    return st.devs.some(d => d.k === k) ? null : true;
  };
  const addDev = (k, forced) => {
    const f = free(k);
    if (!f) return false;
    if (k === 'tool') {
      if (forced && !f.ids.includes(forced)) return false;
      const id = forced || f.ids[Math.floor(Math.random() * f.ids.length)];
      st.devs.push({ k, id, pos: f.pos[0] });
    } else if (k === 'trash' || k === 'spill') st.devs.push({ k, pos: f[Math.floor(Math.random() * f.length)] });
    else st.devs.push({ k });
    st.spawned++;
    return true;
  };
  const addRandom = n => { let tries = 0; while (n > 0 && tries++ < 40) { if (addDev(['tool', 'tool', 'trash', 'spill', 'box', 'bin'][Math.floor(Math.random() * 6)])) n--; } };
  const addExtra = list => (list || []).forEach(x => { const [k, id] = x.split(':'); addDev(k, id); });
  const state = () => Math.max(0, Math.round(100 - st.devs.length * 7 - st.pen));
  const devPos = d => d.k === 'tool' ? BENCH_POS[d.pos] : d.k === 'trash' ? TRASH_POS[d.pos] : d.k === 'spill' ? SPILL_POS[d.pos] : d.k === 'box' ? [430, 500] : [698, 130];
  const sceneOpts = () => ({
    board: ALL_TOOLS.filter(t => !st.devs.some(d => d.k === 'tool' && d.id === t)), labels: true, sil: true, tape: true, minmax: true, zones: true, sched: true,
    benchTools: st.devs.filter(d => d.k === 'tool').map(d => ({ id: d.id, pos: d.pos })),
    trash: st.devs.filter(d => d.k === 'trash').map(d => d.pos), spills: st.devs.filter(d => d.k === 'spill').map(d => d.pos),
    boxWalk: st.devs.some(d => d.k === 'box'), bins: { torn: st.devs.some(d => d.k === 'bin') ? .1 : .6, aran: .7, tar: .55 },
  });

  let running = false;
  function paint() {
    $('#svgbox').innerHTML = sceneSVG(sceneOpts());
    $('#hits').innerHTML = running ? st.devs.map((d, i) => { const [x, y] = devPos(d); return `<div class="hit" data-i="${i}" style="${pct(x, y)}"></div>`; }).join('') : '';
    const v = state();
    $('#state').textContent = v + ' %';
    $('#stateBar').style.width = v + '%';
    $('#stateBar').style.background = v > 65 ? 'var(--green)' : v > 35 ? 'var(--yellow)' : 'var(--red)';
    $$('#days span').forEach((s, i) => s.className = i < st.day ? 'done' : i === st.day ? 'on' : '');
    $('#pend').textContent = st.devs.length;
    $('#habit').textContent = `${st.habit} / ${HABIT_MAX}`;
    $('#habitBar').style.width = (st.habit / HABIT_MAX * 100) + '%';
  }

  view(`<section>
    <div class="stage-head"><div><div class="kicker">5S · Shitsuke 躾 · Disciplina</div><h2 id="dtitle">Una semana de trabajo</h2>
      <p class="muted">Decidí qué hacer en cada situación y hacé la ronda de cierre. Lo que no se corrige, se acumula.</p></div></div>
    <div class="split">
      <div class="scene-wrap" id="sw"><div id="svgbox" class="layer"></div><div class="layer" id="hits"></div></div>
      <div class="side card" style="padding:14px">
        <div class="days" id="days">${DILEMMAS.map(d => `<span>${d.day.slice(0, 3)}</span>`).join('')}</div>
        <div class="row"><b>Estado del puesto</b><span class="spacer"></span><b id="state">100 %</b></div>
        <div class="meter"><i id="stateBar"></i></div>
        <div class="muted" style="font-size:13px">Pendientes fuera de estándar: <b id="pend">0</b></div>
        <div class="row" style="margin-top:4px"><b>Hábito de la semana</b><span class="spacer"></span><b id="habit">0 / ${HABIT_MAX}</b></div>
        <div class="meter"><i id="habitBar"></i></div>
        <div class="muted" style="font-size:12px">Sostenible +3 · A medias +1 · Atajo 0</div>
        <div id="panel"></div>
      </div>
    </div>
  </section>`);
  nextDay();

  async function nextDay() {
    st.day++;
    const D = DILEMMAS[st.day];
    $('#dtitle').textContent = `${D.day} · día ${st.day + 1} de 5`;
    if (st.next) {
      const n = st.next; st.next = null;
      st.pen += n.pen || 0; addExtra(n.extra);
      paint();
      await feedback({ ic: 'chart-decreasing', title: `Consecuencia · ${n.title}`, text: n.text, btn: 'Seguir' });
    }
    addRandom(NEW_PER_DAY[st.day]);
    paint();
    const opts = shuffle(D.o);
    $('#panel').innerHTML = `<div class="dilemma"><div class="kicker">Situación del día</div><div class="q">${D.q}</div>
      ${opts.map((o, i) => `<button class="opt" data-i="${i}">${o.t}</button>`).join('')}</div>`;
    $$('.opt').forEach(b => b.onclick = () => choose(opts, +b.dataset.i));
  }

  async function choose(opts, i) {
    const o = opts[i], D = DILEMMAS[st.day];
    $$('.opt').forEach((b, k) => { const L = LEVELS[opts[k].lv]; b.disabled = true; b.classList.add(k === i ? L.c : 'dim'); b.insertAdjacentHTML('beforeend', `<span class="lv ${L.c}">${L.t}</span>`); });
    if (o.lv === 3) st.best++;
    st.habit += o.lv;
    st.picks.push({ day: D.day, t: o.t, lv: o.lv, best: D.o.find(x => x.lv === 3) });
    st.pen += o.pen || 0;
    addExtra(o.extra);
    if (o.next) st.next = o.next;
    paint();
    const L = LEVELS[o.lv];
    await feedback({ ok: o.lv === 3, ic: o.lv === 3 ? 'check-mark-button' : 'thinking-face', title: `${L.title} · +${o.lv} al hábito`, text: o.lv === 3 ? o.fb : `${o.fb}\n\nLa opción sostenible: ${D.o.find(x => x.lv === 3).t}`, btn: 'Seguir' });
    if (o.skip) {
      $('#panel').insertAdjacentHTML('beforeend', `<p class="muted" style="margin-top:10px">Hoy no hubo ronda de cierre.</p><button class="btn yellow" id="endDay">Terminar el día</button>`);
      $('#endDay').onclick = () => endDay(0, true);
    } else {
      $('#panel').insertAdjacentHTML('beforeend', `<div style="margin-top:12px"><b>Ronda de cierre</b><p class="muted" style="font-size:13px">Tenés ${ROUND} segundos: tocá todo lo que esté fuera del estándar.</p>
        <div class="timebar"><i id="tb"></i></div><button class="btn yellow" id="startRound" style="margin-top:10px">Empezar ronda</button></div>`);
      $('#startRound').onclick = round;
    }
  }

  function round() {
    $('#startRound').disabled = true;
    running = true;
    const fixedStart = st.fixed;
    paint();
    $('#hits').onclick = e => {
      const hit = e.target.closest('[data-i]');
      if (!hit || !running) return;
      const d = st.devs[+hit.dataset.i];
      st.devs.splice(+hit.dataset.i, 1);
      st.fixed++;
      toast(FIX_MSG[d.k], 'ok');
      paint();
      if (!st.devs.length) close();
    };
    const t0 = performance.now();
    const tick = () => {
      if (!running) return;
      const left = 1 - (performance.now() - t0) / (ROUND * 1000);
      $('#tb').style.width = Math.max(0, left * 100) + '%';
      if (left <= 0) close(); else requestAnimationFrame(tick);
    };
    tick();
    function close() { if (!running) return; running = false; paint(); endDay(st.fixed - fixedStart, false); }
  }

  async function endDay(done, skipped) {
    const pend = st.devs.length;
    await feedback({
      ok: pend === 0 && !skipped, ic: pend === 0 ? 'glowing-star' : 'clipboard', title: `Fin del ${DILEMMAS[st.day].day.toLowerCase()}`,
      text: skipped ? `Sin ronda de cierre: quedan ${pend} cosas fuera de estándar para mañana.`
        : pend === 0 ? `Corregiste ${done} desvío${done === 1 ? '' : 's'} y el puesto quedó en estándar.`
        : `Corregiste ${done}, pero quedaron ${pend} pendientes que se suman a los de mañana.`,
      btn: st.day < 4 ? 'Siguiente día' : 'Ver resultado de la semana' });
    if (st.day < 4) return nextDay();
    S.r.shitsuke = { best: st.best, habit: st.habit, picks: st.picks, fixed: st.fixed, spawned: st.spawned, state: state() };
    stageEnd(4,
      `<div class="compare">
        <div class="metric"><div class="v">${st.habit} / ${HABIT_MAX}</div><div class="l">hábito de la semana (${st.best} decisiones sostenibles)</div></div>
        <div class="metric"><div class="v">${st.fixed} / ${st.spawned}</div><div class="l">desvíos corregidos en las rondas</div></div>
        <div class="metric"><div class="v">${state()} %</div><div class="l">estado del puesto el viernes</div></div>
      </div>`,
      'la disciplina no es un esfuerzo heroico: son <b>decisiones chicas que se repiten</b>. Hacer la ronda aunque haya apuro, corregir y avisar, cumplir el cronograma aunque nadie controle y no maquillar para la auditoría. Cada atajo vuelve después como pérdida de tiempo o como falla.');
  }
}

// =========================================================
// AUDITORÍA FINAL
// =========================================================
const TIPS = {
  seiri: 'Antes de ordenar, preguntate: ¿esto se usa? ¿cada cuánto? Lo dudoso lleva tarjeta roja con fecha y responsable.',
  seiton: 'Un lugar para cada cosa y cada cosa en su lugar: lo más usado más cerca, y todo identificado con una etiqueta.',
  seiso: 'Limpiar es inspeccionar: cada anomalía que aparece se reporta, no se tapa ni se deja para después.',
  seiketsu: 'Un estándar es un control visual en el puesto que dice qué, dónde y cuánto, con lo justo: ni zonas sin control ni controles de más.',
  shitsuke: 'La disciplina son decisiones chicas que se repiten: la ronda diaria, corregir y avisar, y no maquillar para la auditoría.',
};
function computeScores() {
  const r = S.r;
  const to5 = x => Math.round((1 + 4 * clamp(x)) * 10) / 10;
  const seiri = r.seiri ? r.seiri.ok / r.seiri.total : 0;
  const seiton = r.seiton ? .7 * ((r.seiton.eval?.total || 0) / 100) + .3 * clamp((r.seiton.tBefore - r.seiton.tAfter) / r.seiton.tBefore / .7) : 0;
  const seiso = r.seiso ? clamp(.3 * clamp(r.seiso.clean / .9) + .2 * (r.seiso.rep / r.seiso.total) + .3 * (r.seiso.act / r.seiso.total) + .2 * r.seiso.src - r.seiso.toolErr * .02) : 0;
  const seiketsu = r.seiketsu ? r.seiketsu.score / 100 : 0;
  const shitsuke = r.shitsuke ? .5 * (r.shitsuke.habit / HABIT_MAX) + .3 * (r.shitsuke.fixed / Math.max(1, r.shitsuke.spawned)) + .2 * (r.shitsuke.state / 100) : 0;
  return { seiri: to5(seiri), seiton: to5(seiton), seiso: to5(seiso), seiketsu: to5(seiketsu), shitsuke: to5(shitsuke) };
}
function radar(sc) {
  const keys = STAGES.map(s => s.key), cx = 170, cy = 165, R = 115;
  const pt = (i, v) => { const a = (-90 + i * 72) * Math.PI / 180; return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v]; };
  const poly = v => keys.map((_, i) => pt(i, v).join(',')).join(' ');
  let g = '';
  for (let l = 1; l <= 5; l++) g += `<polygon points="${poly(l / 5)}" fill="none" stroke="#e2e2de"/>`;
  keys.forEach((_, i) => { const [x, y] = pt(i, 1); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e2de"/>`; });
  g += `<polygon points="${keys.map((k, i) => pt(i, sc[k] / 5).join(',')).join(' ')}" fill="rgba(245,82,0,.16)" stroke="#f55200" stroke-width="2"/>`;
  keys.forEach((k, i) => {
    const [x, y] = pt(i, sc[k] / 5); g += `<circle cx="${x}" cy="${y}" r="4" fill="#121212"/>`;
    const [lx, ly] = pt(i, 1.22);
    g += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="500" fill="#121212" font-family="Geist, Helvetica, Arial">${STAGES[i].jp}</text>
      <text x="${lx}" y="${ly + 15}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#6b6b66" font-family="Geist Mono, monospace">${dec(sc[k])}</text>`;
  });
  return `<svg viewBox="0 0 340 340" width="100%" style="max-width:360px" role="img" aria-label="Gráfico radar de la auditoría 5S">${g}</svg>`;
}
// Punto de mejora de cada etapa, calculado a partir de lo que hizo la persona
function stageTip(key) {
  const r = S.r[key];
  if (!r) return TIPS[key];
  if (key === 'seiri') return r.tip || (r.score >= 100 ? 'Clasificaste todo con buen criterio. Para sostenerlo, lo dudoso tiene que tener fecha y responsable en su tarjeta roja.' : TIPS.seiri);
  if (key === 'seiton') return r.eval?.tip || TIPS.seiton;
  if (key === 'seiso') {
    if (!r.src) return 'Limpiaste, pero ante la suciedad que vuelve elegiste atacar el síntoma. La mejor limpieza es no ensuciar: buscá la fuente (virutas, pérdidas) y eliminala.';
    if (r.act < r.total) return `${r.wrong.join(' y ')}: la acción que elegiste no resolvía la causa. Ante una anomalía, primero se identifica de dónde viene, se señaliza y se reporta a quien corresponde.`;
    if (r.toolErr) return 'Usaste un método de limpieza que no correspondía a la zona. Antes de limpiar, mirá qué es: nunca húmedo en lo eléctrico.';
    if (r.clean < .9) return 'Quedó parte del puesto sin limpiar. Limpiar todo, también lo que no se ve, es lo que deja a la vista las fallas.';
    return 'Limpiaste, inspeccionaste y atacaste la fuente. Para sostenerlo, armá un cronograma con responsable y frecuencia.';
  }
  if (key === 'seiketsu') return r.tip || TIPS.seiketsu;
  if (key === 'shitsuke') {
    const miss = [...r.picks].sort((a, b) => a.lv - b.lv).find(p => p.lv < 3);
    if (miss) return `El ${miss.day.toLowerCase()} elegiste “${miss.t.replace(/\.$/, '')}” (${LEVELS[miss.lv].t.toLowerCase()}). La opción sostenible era: ${miss.best.t.charAt(0).toLowerCase() + miss.best.t.slice(1)}`;
    const left = r.spawned - r.fixed;
    if (left > 0) return `Tus decisiones fueron sostenibles, pero en las rondas de cierre quedaron ${left} desvío${left === 1 ? '' : 's'} sin corregir. Recorré el puesto siempre en el mismo orden (tablero, mesa, piso, estante) para no saltearte nada.`;
    return 'Semana impecable: decisiones sostenibles y rondas completas. El desafío ahora es que el equipo haga lo mismo cuando no estás.';
  }
  return TIPS[key];
}
function audit() {
  setStep(5);
  S.replay = null;
  const sc = computeScores();
  const keys = STAGES.map(s => s.key);
  const avg = keys.reduce((a, k) => a + sc[k], 0) / keys.length;
  const low = keys.reduce((a, k) => sc[k] < sc[a] ? k : a, keys[0]);
  if (!S.first) S.first = { ...sc };
  const verdict = avg >= 4.5 ? 'Puesto de clase mundial' : avg >= 3.5 ? 'Buen nivel, con margen de mejora' : avg >= 2.5 ? 'En camino' : 'Hay que reforzar la base';
  const lowS = STAGES.find(s => s.key === low);
  const diff = k => { const d = Math.round((sc[k] - S.first[k]) * 10) / 10; return d ? ` <span style="font-size:12px;color:${d > 0 ? 'var(--green-text)' : 'var(--danger)'}">${d > 0 ? '+' : ''}${dec(d)}</span>` : ''; };
  view(`<section class="card">
    <div class="kicker">Auditoría 5S · resultado final</div>
    <div class="audit">
      <div>${radar(sc)}</div>
      <div>
        <div class="row" style="align-items:flex-end;margin-bottom:14px">
          <div class="total">${dec(avg.toFixed(1))}<span style="font-size:22px;color:var(--muted)"> / 5</span></div>
          <div><b>${verdict}</b><div class="muted" style="font-size:13px">Promedio de las 5S</div></div>
        </div>
        ${STAGES.map(s => `<div class="score-row wide"><span><b>${s.jp}</b> <span class="muted" style="font-size:12px">${s.es}</span></span>
          <div class="meter"><i data-w="${(sc[s.key] / 5) * 100}"></i></div><b>${dec(sc[s.key])}${diff(s.key)}</b>
          <button class="retry" data-retry="${STAGES.indexOf(s)}">Repetir</button>
          <div class="srow-tip"><b style="font-weight:500;text-align:left">Punto de mejora:</b> ${stageTip(s.key)}</div></div>`).join('')}
      </div>
    </div>
    <div class="next-step">
      <div class="kicker">Tu próximo paso</div>
      <b style="font-size:17px;font-weight:500">${lowS.jp} · ${lowS.es} es la etapa con más margen (${dec(sc[low])} / 5)</b>
      <p>${stageTip(low)}</p>
      <div class="row" style="margin-top:12px"><button class="btn yellow" data-retry="${STAGES.indexOf(lowS)}">Repetir ${lowS.jp}</button></div>
    </div>
    <div class="row" style="margin-top:22px">${S.user ? `<span class="muted" style="font-size:13px">${esc(S.user.nombre)} ${esc(S.user.apellido)} · ${esc(S.user.sector)}</span><span id="saveState" class="chip">Guardando resultado…</span>` : ''}<span class="spacer"></span>
      <button class="btn ghostbtn" id="newp">Nuevo participante</button>
      <button class="btn ghostbtn" id="again">Jugar todo de nuevo</button></div>
  </section>`);
  requestAnimationFrame(() => $$('.score-row .meter i').forEach(i => i.style.width = i.dataset.w + '%'));
  saveResult(sc, avg);
  $$('[data-retry]').forEach(b => b.onclick = () => { S.replay = true; intro(+b.dataset.retry); });
  $('#again').onclick = () => { S.r = {}; S.first = null; S.saved = false; S.t0 = Date.now(); intro(0); };
  $('#newp').onclick = () => { S.first = null; register(); };
}

// =========================================================
// REGISTRO, GUARDADO DE RESULTADOS Y PANEL DE ADMINISTRACIÓN
// =========================================================
const db = () => window.DB ? Promise.resolve(window.DB) : new Promise(r => window.addEventListener('db-ready', () => r(window.DB), { once: true }));
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function register() {
  S.user = null;
  setStep(-1);
  $('#steps').style.visibility = 'hidden';
  view(`<section style="display:grid;place-items:center;min-height:70vh">
    <div class="card" id="reg" style="width:min(440px,100%);display:grid;gap:14px">
      <div><div class="kicker">Prácticas 5S</div><h2>Antes de empezar</h2>
        <p class="muted" style="margin:0">Anotate para que tu resultado quede registrado en el seguimiento del sector.</p></div>
      <label class="fld"><span>Nombre</span><input name="nombre" autocomplete="given-name" maxlength="60" required></label>
      <label class="fld"><span>Apellido</span><input name="apellido" autocomplete="family-name" maxlength="60" required></label>
      <label class="fld"><span>Sector</span><input name="sector" maxlength="80" required placeholder="Ej.: Mantenimiento"></label>
      <label class="chk"><input type="checkbox" id="regTest"><span>Partida de prueba <small class="muted">· se guarda marcada y no cuenta en las estadísticas</small></span></label>
      <p class="muted" id="regErr" style="margin:0;color:var(--danger);display:none">Completá nombre, apellido y sector.</p>
      <button class="btn yellow" type="button" id="regGo">Continuar</button>
      <button class="btn ghostbtn" type="button" id="toAdmin" style="height:32px;font-size:12px">Acceso de administración</button>
    </div>
  </section>`);
  const go = () => {
    const u = Object.fromEntries(['nombre', 'apellido', 'sector'].map(k => [k, $(`#reg input[name=${k}]`).value.trim()]));
    if (!u.nombre || !u.apellido || !u.sector) { $('#regErr').style.display = ''; return; }
    if ($('#regTest').checked) u.prueba = true;
    S.user = u; S.t0 = Date.now(); S.saved = false;
    $('#steps').style.visibility = '';
    home();
  };
  $('#regGo').onclick = go;
  $$('#reg input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
  $('#reg input[name=nombre]').focus();

}

async function saveResult(sc, avg) {
  const pill0 = $('#saveState');
  if (S.saved && pill0) { pill0.textContent = 'Se guardó el primer resultado'; pill0.className = 'chip chip-ok'; }
  if (S.saved || !S.user) return;
  const r = S.r;
  const doc = {
    nombre: S.user.nombre, apellido: S.user.apellido, sector: S.user.sector,
    total: Math.round(avg * 10) / 10, scores: sc,
    seiton: { criterio: r.seiton?.eval ? (r.seiton.eval.clear || r.seiton.eval.declared ? r.seiton.eval.main.n : 'sin criterio claro') : '', puntaje: r.seiton?.eval?.total ?? 0, intentos: r.seiton?.attempts ?? 0 },
    duracionMin: Math.round((Date.now() - (S.t0 || Date.now())) / 6000) / 10,
    version: 1,
  };
  if (S.user.prueba) doc.prueba = true;
  const pill = $('#saveState');
  try {
    await (await db()).save(doc);
    S.saved = true;
    if (pill) { pill.textContent = 'Resultado guardado'; pill.className = 'chip chip-ok'; }
  } catch (err) {
    console.warn(err);
    if (pill) { pill.textContent = 'No se pudo guardar el resultado'; pill.className = 'chip chip-ko'; }
  }
}

function adminLogin() {
  $('#steps').style.visibility = 'hidden';
  db().then(api => {
    view(`<section style="display:grid;place-items:center;min-height:70vh">
      <div class="card" id="adm" style="width:min(420px,100%);display:grid;gap:14px">

          <p class="muted" style="margin:0">${api.mode === 'local' ? 'Modo local de prueba: los datos se guardan solo en este navegador. Contraseña de prueba: admin5s.' : 'Ingresá la contraseña de administración para ver los resultados de los participantes.'}</p></div>

        <td><span class="score ${r.total >= 4 ? 'hi' : r.total >= 3 ? 'mid' : 'lo'}">${dec(Number(r.total).toFixed(1))}</span></td>
        ${keys.map(k => `<td>${r.scores?.[k] != null ? dec(Number(r.scores[k]).toFixed(1)) : '—'}</td>`).join('')}
        <td>${esc(r.seiton?.criterio || '—')}</td><td>${r.duracionMin != null ? dec(r.duracionMin) + ' min' : '—'}</td></tr>`).join('')
        : `<tr><td colspan="${7 + keys.length}" class="muted" style="text-align:center;padding:28px">Todavía no hay resultados${state.sector || state.q ? ' para este filtro' : ''}.</td></tr>`}</tbody>`;
    $$('[data-sel]').forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.sel) : sel.delete(c.dataset.sel); render(); });
    $('#selAll').onchange = e => { list.forEach(r => e.target.checked ? sel.add(r.id) : sel.delete(r.id)); render(); };
    $$('#tbl th[data-sort]').forEach(t => t.onclick = () => { const k = t.dataset.sort; state.dir = state.sort === k ? -state.dir : (k === 'nombre' || k === 'sector' ? 1 : -1); state.sort = k; render(); });
  };
  render();
  $('#q').oninput = e => { state.q = e.target.value; render(); };
  $('#sec').onchange = e => { state.sector = e.target.value; render(); };
  $('#tests').onchange = e => { state.tests = e.target.checked; render(); };
  $('#selClear').onclick = () => { sel.clear(); render(); };
  const doDelete = async (ids, what) => {
    if (!ids.length) return toast('No hay resultados para borrar.', 'ko');
    if (!await confirmDelete(`Vas a borrar ${what}: ${ids.length} resultado${ids.length === 1 ? '' : 's'}. No se puede deshacer.`)) return;
    try {
      await api.remove(ids);
      const del = new Set(ids); rows = rows.filter(r => !del.has(r.id)); ids.forEach(id => sel.delete(id));
      render(); toast(`Se borraron ${ids.length} resultado${ids.length === 1 ? '' : 's'}.`, 'ok');
    } catch (err) { console.warn(err); toast('No se pudo borrar. Revisá que las reglas de Firestore estén publicadas.', 'ko'); }
  };
  $('#selDel').onclick = () => doDelete([...sel], 'los seleccionados');
  $('#delMenu').onclick = async () => {
    const nT = rows.filter(r => r.prueba).length;
    const pick = await choiceDialog('Borrar resultados', 'Elegí qué querés borrar. También podés tildar filas en la tabla y borrar solo esas.', [
      { k: 'tests', t: `Solo las partidas de prueba (${nT})` },
      { k: 'all', t: `Todos los resultados (${rows.length})`, danger: true },
    ]);
    if (pick === 'tests') doDelete(rows.filter(r => r.prueba).map(r => r.id), 'las partidas de prueba');
    if (pick === 'all') doDelete(rows.map(r => r.id), 'todos los resultados');
  };
  const toCSV = () => {
    const head = ['Fecha', 'Apellido', 'Nombre', 'Sector', 'Promedio', ...STAGES.map(s => s.jp), 'Criterio Seiton', 'Puntaje Seiton', 'Duración (min)'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    return [head.map(q).join(';'), ...filtered().map(r => [fmtDate(r.fecha), r.apellido, r.nombre, r.sector, dec(r.total), ...keys.map(k => dec(r.scores?.[k] ?? '')), r.seiton?.criterio, r.seiton?.puntaje, dec(r.duracionMin ?? '')].map(q).join(';'))].join('\n');
  };
  $('#csv').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + toCSV()], { type: 'text/csv;charset=utf-8' }));
    a.download = `resultados-5s-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#copy').onclick = async () => {
    try { await navigator.clipboard.writeText(toCSV().replace(/;/g, '\t').replace(/"/g, '')); toast('Tabla copiada: pegala en Excel o Google Sheets.', 'ok'); }
    catch { toast('No se pudo copiar desde este navegador.', 'ko'); }
  };
  $('#out').onclick = async () => { await api.logout(); register(); };
}


if (location.hash === '#admin') adminLogin(); else register();
</script>
</body>
</html>
