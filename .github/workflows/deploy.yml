# Publica en Firebase Hosting cada vez que se sube algo a main.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT_PRACTICAS_5S (lo crea `firebase init hosting:github`).
name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICAS_5S }}
          channelId: live
          projectId: practicas-5s
